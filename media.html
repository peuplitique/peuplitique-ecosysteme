    <div data-lang="fr">

        <div class="carte">
            <h2>Un média citoyen indépendant</h2>
            <p>
                Le média citoyen de Peuplitique fournit une information claire, vérifiée et accessible,
                sans influence politique ou économique. Il permet aux citoyens de comprendre les enjeux
                nationaux et internationaux.
            </p>
        </div>

        <div class="carte">
            <h2>Analyses et synthèses</h2>
            <p>
                Les analyses sont produites à partir de données publiques, de recherches scientifiques
                et de contributions citoyennes. L’objectif est de rendre l’information compréhensible
                et utile pour la prise de décision collective.
            </p>
        </div>

        <div class="carte">
             <h2>Agrégation des médias et vérification citoyenne</h2>

    <p>
        Le Média citoyen de Peuplitique rassemble les informations publiées
        par différents médias, institutions, chercheurs et citoyens.
        Les contenus sont comparés, recoupés et analysés afin d'identifier
        les faits vérifiables et de réduire les risques de désinformation.
    </p>

    <p>
        Aucune source unique ne peut dominer le système. Chaque information
        est confrontée à plusieurs points de vue afin de distinguer les faits,
        les opinions et les éventuelles propagandes politiques, économiques
        ou idéologiques.
    </p>
</div>

<div class="carte">
    <h2>Système de sécurité et de transparence</h2>

    <ul>
        <li>Vérification croisée des sources.</li>
        <li>Traçabilité complète des données utilisées.</li>
        <li>Publication des références et documents d'origine.</li>
        <li>Détection automatisée des contradictions et incohérences.</li>
        <li>Signalement citoyen des erreurs ou informations contestées.</li>
        <li>Protection contre la manipulation coordonnée de l'information.</li>
        <li>Historique public des corrections et mises à jour.</li>
    </ul>

    <p>
        L'objectif est de garantir une information transparente,
        vérifiable et indépendante, tout en protégeant la plateforme
        contre les tentatives de désinformation, d'influence abusive
        ou de manipulation collective.
    </p>
</div>                
            <h2>Transparence totale</h2>
            <p>
                Chaque article, graphique ou synthèse indique ses sources, ses méthodes et ses limites.
                La transparence est un pilier fondamental du média citoyen.
            </p>
        </div>

        <div class="carte">
            <h2>IA citoyenne</h2>
            <p>
                L’IA non‑censurante génère des résumés, compare les données, détecte les tendances
                et met en lumière les points d’accord entre citoyens.
            </p>
        </div>

        <div class="carte">
            <h2>Formats disponibles</h2>
            <ul>
                <li>Articles courts</li>
                <li>Analyses longues</li>
                <li>Graphiques interactifs</li>
                <li>Vidéos explicatives</li>
                <li>Podcasts citoyens</li>
            </ul>
        </div>

            <h2>An independent citizen media</h2>
            <p>
                The citizen media of Peuplitique provides clear, verified and accessible information,
                free from political or economic influence. It helps citizens understand national
                and international issues.
            </p>
        </div>

        <div class="carte">
         <h2>Media aggregation and citizen verification</h2>

    <p>
        The Peuplitique Citizen Media gathers and analyzes information published
        by media organizations, institutions, researchers, associations and citizens.
        Content is compared, cross-checked and verified in order to identify the most
        reliable facts and reduce the risks of misinformation.
    </p>

    <p>
        No single source has a monopoly on information. Every topic is examined
        through multiple perspectives to distinguish verifiable facts, opinions
        and potential political, economic or ideological propaganda.
    </p>
</div>

<div class="carte">
    <h2>Security and transparency system</h2>

    <p>
        Peuplitique integrates a security framework designed to protect the integrity
        of information and ensure complete transparency of analyses.
    </p>

    <ul>
        <li>Cross-verification of sources.</li>
        <li>Full traceability of data used.</li>
        <li>Publication of references and original documents.</li>
        <li>Detection of contradictions and inconsistencies.</li>
        <li>Citizen reporting of errors or disputed content.</li>
        <li>Protection against information manipulation campaigns.</li>
        <li>Public history of corrections and updates.</li>
        <li>Transparent monitoring of analyses generated by Citizen AI.</li>
    </ul>

    <p>
        The objective is to provide independent, verifiable and transparent
        information while protecting the platform against disinformation,
        undue influence and coordinated manipulation attempts.
    </p>
</div>
